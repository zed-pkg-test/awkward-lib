[project]
name = "zedtest-awkward-lib"
version = "0.1.0"
description = "Python slice whose directory name says nothing about its language"
license = { text = "MIT" }
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["awkward_lib*"]
